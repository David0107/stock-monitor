name: Dual Market Monitor Update
on:
  schedule:
    - cron: '30 7 * * 1-5'   # 北京时间 15:30 (A股收盘后)
    - cron: '30 21 * * 1-5'  # 北京时间 05:30 (美股收盘后)
  workflow_dispatch:           # 支持手动点击立即运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install akshare yfinance pandas
      - run: python update.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.json history/
          git commit -m "chore: update CN & US market data" || exit 0
          git push
